name: H700 SDL2 display probe
on:
  workflow_dispatch:
  push:
    branches: [h700-upstream-update]
    paths:
      - tools/h700-display-probe/**
      - .github/workflows/build-h700-display-probe.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    steps:
      - name: Dependencies
        run: |
          sed -i -e 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' -e 's|deb.debian.org/debian|archive.debian.org/debian|g' -e '/bullseye-updates/d' /etc/apt/sources.list
          apt-get update
          apt-get install -y gcc libsdl2-dev pkg-config git ca-certificates file
      - uses: actions/checkout@v4
      - name: Build and check
        run: |
          mkdir -p out/H7Flash-teste-tela
          gcc -O2 -Wall -Wextra -Werror tools/h700-display-probe/probe.c $(pkg-config --cflags --libs sdl2) -o out/H7Flash-teste-tela/h700-display-probe
          bash -n 'tools/h700-display-probe/H7Flash - Teste de tela.sh'
          cp 'tools/h700-display-probe/H7Flash - Teste de tela.sh' out/
          file out/H7Flash-teste-tela/h700-display-probe
          SDL_VIDEODRIVER=driver_that_does_not_exist out/H7Flash-teste-tela/h700-display-probe > out/H7Flash-teste-tela/ci-failure-path.txt 2>&1 && exit 1 || test "$?" = 2
          sha256sum out/H7Flash-teste-tela/h700-display-probe > out/H7Flash-teste-tela/sha256.txt
          echo "$GITHUB_SHA" > out/H7Flash-teste-tela/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: H7Flash-teste-tela
          path: out/
