name: Build H7Flash Ruffle (H700)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile (dist = LTO, slower to build but faster to run; release = quick build)"
        type: choice
        default: dist
        options:
          - dist
          - release
      gc_tune:
        description: "Let the garbage collector run less often (fewer long pauses; uses a bit more memory)"
        type: boolean
        default: true
      frame_skip:
        description: "Skip drawing some frames while the game is behind schedule (keeps game speed closer to normal)"
        type: boolean
        default: true
      mimalloc:
        description: "Use the mimalloc memory allocator (usually a bit faster than the system one)"
        type: boolean
        default: true
      perf_timing:
        description: "Print per-2s timing of tick / render / present into the game log (diagnostic)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: debian:bullseye

    steps:
      - name: Install dependencies
        run: |
          # Debian bullseye is end-of-life: use the archive mirror
          sed -i -e 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' \
                 -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
                 -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
                 -e '/bullseye-updates/d' /etc/apt/sources.list || true
          rm -f /etc/apt/sources.list.d/*.list 2>/dev/null || true
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          cat /etc/apt/sources.list
          apt update
          apt install -y \
            git curl ca-certificates build-essential pkg-config python3 \
            libssl-dev libasound2-dev libudev-dev \
            libfontconfig1-dev libxcb1-dev zlib1g-dev \
            libglib2.0-dev libgtk-3-dev libgdk-pixbuf2.0-dev \
            libpango1.0-dev libcairo2-dev \
            libc-bin file default-jre-headless \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1 binutils

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use current branch code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          echo "Código que será compilado:"
          git log -1 --format="%H%n%ci%n%s"

          git rev-parse HEAD > /tmp/ruffle_revision.txt

          echo "Verificando alteração do backend H700..."
          grep -n "H700" render/wgpu/src/backend.rs || true

          if grep -q "H700 ADAPTER ENUMERATION" render/wgpu/src/backend.rs; then
            echo "OK: patch de diagnóstico encontrado."
          else
            echo "ERRO: o backend.rs modificado não foi encontrado."
            echo "Confirme que você salvou, fez commit e sincronizou a alteração."
            exit 1
          fi

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 \
            -sSf https://sh.rustup.rs | sh -s -- -y

          . "$HOME/.cargo/env"
          rustup show
          rustc --version
          cargo --version

      - name: Fetch dependencies
        run: |
          . "$HOME/.cargo/env"
          cargo fetch

      - name: Tune GC pacing (optional)
        if: ${{ inputs.gc_tune }}
        run: |
          python3 - <<'PY'
          # Make the garbage collector wake up less often (fewer, rarer pauses) by editing the default pacing
          # constants of the gc-arena crate checked out by cargo. If the expected text is not found, nothing changes.
          import glob, os, re

          home = os.path.expanduser("~")
          files = glob.glob(os.path.join(home, ".cargo", "git", "checkouts", "gc-arena-*", "*", "src", "*.rs"))
          changed = False
          for f in files:
              s = open(f, encoding="utf-8").read()
              if "sleep_factor" not in s or "min_sleep" not in s:
                  continue
              new = re.sub(r"(sleep_factor:\s*)0\.5\b", r"\g<1>1.0", s, count=1)
              new = re.sub(r"(min_sleep:\s*)4096\b", r"\g<1>262144", new, count=1)
              if new != s:
                  open(f, "w", encoding="utf-8").write(new)
                  print("gc-arena pacing tuned in", f)
                  changed = True
                  for line in new.splitlines():
                      if "sleep_factor:" in line or "min_sleep:" in line:
                          print("   ", line.strip())
          if not changed:
              print("gc-arena default pacing not found or already different: GC left unchanged")
          PY

      - name: Apply frame skip (optional)
        if: ${{ inputs.frame_skip }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("desktop/src/app.rs")
          s = p.read_text(encoding="utf-8")

          def rep(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)

          mod = '''
          mod h700_skip {
              // Skip drawing some frames while the game logic is persistently behind schedule, so slow-to-draw
              // scenes do not slow the game down. Hysteresis avoids flipping between modes frame by frame
              // (that looked like micro-stutter). Disable with HOBO_NO_SKIP=1.
              use std::sync::OnceLock;
              use std::sync::atomic::{AtomicBool, AtomicU32, AtomicU64, Ordering};
              use std::time::Instant;

              static BEHIND_N: AtomicU32 = AtomicU32::new(0);
              static OK_N: AtomicU32 = AtomicU32::new(0);
              static SKIPPING: AtomicBool = AtomicBool::new(false);
              static LAST_END_US: AtomicU64 = AtomicU64::new(0);
              static LAST_COST_US: AtomicU64 = AtomicU64::new(0);

              fn epoch() -> Instant {
                  static E: OnceLock<Instant> = OnceLock::new();
                  *E.get_or_init(Instant::now)
              }

              fn now_us() -> u64 {
                  epoch().elapsed().as_micros() as u64
              }

              fn disabled() -> bool {
                  static D: OnceLock<bool> = OnceLock::new();
                  *D.get_or_init(|| std::env::var("HOBO_NO_SKIP").map(|v| v == "1").unwrap_or(false))
              }

              pub fn note_tick(behind: bool) {
                  if behind {
                      OK_N.store(0, Ordering::Relaxed);
                      let n = BEHIND_N.fetch_add(1, Ordering::Relaxed) + 1;
                      if n >= 6 {
                          SKIPPING.store(true, Ordering::Relaxed);
                      }
                  } else {
                      BEHIND_N.store(0, Ordering::Relaxed);
                      let n = OK_N.fetch_add(1, Ordering::Relaxed) + 1;
                      if n >= 4 {
                          SKIPPING.store(false, Ordering::Relaxed);
                      }
                  }
              }

              pub fn render_done(start: Instant) {
                  LAST_COST_US.store(start.elapsed().as_micros() as u64, Ordering::Relaxed);
                  LAST_END_US.store(now_us(), Ordering::Relaxed);
              }

              pub fn should_render() -> bool {
                  if disabled() || !SKIPPING.load(Ordering::Relaxed) {
                      return true;
                  }
                  let since = now_us().saturating_sub(LAST_END_US.load(Ordering::Relaxed));
                  let cost = LAST_COST_US.load(Ordering::Relaxed);
                  // sustained backlog: draw at most ~25 times per second and spend at most ~25% of the time drawing
                  let wait = (cost * 3).clamp(40_000, 150_000);
                  since >= wait
              }
          }
          '''
          rep("impl MainWindow {", mod + "\nimpl MainWindow {")
          rep("if !self.minimized {\n                let mut player = self.player.get();",
              "if !self.minimized {\n                let __h700_t0 = std::time::Instant::now();\n                let mut player = self.player.get();")
          rep("plot_stats_in_tracy(&self.gui.descriptors().wgpu_instance);",
              "plot_stats_in_tracy(&self.gui.descriptors().wgpu_instance);\n                h700_skip::render_done(__h700_t0);")
          rep("player.tick(dt);\n                    new_time + player.time_til_next_frame()",
              "player.tick(dt);\n                    let __til = player.time_til_next_frame();\n                    h700_skip::note_tick(__til.is_zero());\n                    new_time + __til")
          rep("if player.map(|p| p.needs_render()).unwrap_or_default() || self.gui.needs_render() {\n            self.gui.window().request_redraw();",
              "if (player.map(|p| p.needs_render()).unwrap_or_default() || self.gui.needs_render())\n            && h700_skip::should_render()\n        {\n            self.gui.window().request_redraw();")
          p.write_text(s, encoding="utf-8")
          print("OK frame skip patch")
          PY
          grep -n "h700_skip" desktop/src/app.rs | head -5

      - name: Apply mimalloc (optional)
        if: ${{ inputs.mimalloc }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path("desktop/Cargo.toml")
          t = c.read_text(encoding="utf-8")
          anchor = "[dependencies]\n"
          assert t.count(anchor) == 1
          t = t.replace(anchor, anchor + 'mimalloc = { version = "0.1", default-features = false }\n', 1)
          c.write_text(t, encoding="utf-8")

          m = Path("desktop/src/main.rs")
          s = m.read_text(encoding="utf-8")
          anchor = "static RUFFLE_VERSION: &str = concat!("
          assert s.count(anchor) == 1
          s = s.replace(anchor, '#[cfg(not(feature = "tracy"))]\n#[global_allocator]\nstatic GLOBAL_MIMALLOC: mimalloc::MiMalloc = mimalloc::MiMalloc;\n\n' + anchor, 1)
          m.write_text(s, encoding="utf-8")
          print("OK mimalloc patch")
          PY
          grep -n "mimalloc" desktop/Cargo.toml desktop/src/main.rs

      - name: Add H700 timing logs (optional)
        if: ${{ inputs.perf_timing }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("desktop/src/app.rs")
          s = p.read_text(encoding="utf-8")

          mod = '''
          mod h700_perf {
              use std::sync::atomic::{AtomicU64, Ordering};
              use std::sync::Mutex;
              use std::time::Instant;

              pub static TICK_US: AtomicU64 = AtomicU64::new(0);
              pub static TICK_N: AtomicU64 = AtomicU64::new(0);
              pub static REND_US: AtomicU64 = AtomicU64::new(0);
              pub static REND_N: AtomicU64 = AtomicU64::new(0);
              pub static GUI_US: AtomicU64 = AtomicU64::new(0);
              pub static GUI_N: AtomicU64 = AtomicU64::new(0);
              pub static TICK_MAX: AtomicU64 = AtomicU64::new(0);
              pub static REND_MAX: AtomicU64 = AtomicU64::new(0);
              pub static GUI_MAX: AtomicU64 = AtomicU64::new(0);
              pub static TICK_SLOW: AtomicU64 = AtomicU64::new(0);
              pub static REND_SLOW: AtomicU64 = AtomicU64::new(0);
              pub static GUI_SLOW: AtomicU64 = AtomicU64::new(0);
              static LAST: Mutex<Option<Instant>> = Mutex::new(None);

              pub fn add(us: &AtomicU64, n: &AtomicU64, mx: &AtomicU64, slow: &AtomicU64, start: Instant) {
                  let e = start.elapsed().as_micros() as u64;
                  us.fetch_add(e, Ordering::Relaxed);
                  n.fetch_add(1, Ordering::Relaxed);
                  mx.fetch_max(e, Ordering::Relaxed);
                  if e > 60_000 {
                      slow.fetch_add(1, Ordering::Relaxed);
                  }
              }

              fn take(us: &AtomicU64, n: &AtomicU64) -> (u64, u64) {
                  (us.swap(0, Ordering::Relaxed), n.swap(0, Ordering::Relaxed))
              }

              pub fn report() {
                  let mut last = LAST.lock().unwrap();
                  let now = Instant::now();
                  let start = *last.get_or_insert(now);
                  if now.duration_since(start).as_secs_f64() < 2.0 {
                      return;
                  }
                  *last = Some(now);
                  let (tu, tn) = take(&TICK_US, &TICK_N);
                  let (ru, rn) = take(&REND_US, &REND_N);
                  let (gu, gn) = take(&GUI_US, &GUI_N);
                  let avg = |u: u64, n: u64| if n == 0 { 0.0 } else { u as f64 / n as f64 / 1000.0 };
                  let mxv = |a: &AtomicU64| a.swap(0, Ordering::Relaxed) as f64 / 1000.0;
                  let slw = |a: &AtomicU64| a.swap(0, Ordering::Relaxed);
                  eprintln!(
                      "H700 PERF (2s): tick {} calls avg {:.1} ms | player.render {} calls avg {:.1} ms | gui.render+present {} calls avg {:.1} ms",
                      tn, avg(tu, tn), rn, avg(ru, rn), gn, avg(gu, gn)
                  );
                  eprintln!(
                      "H700 SPIKE (2s): max tick {:.0} ms, render {:.0} ms, present {:.0} ms | frames >60ms: tick {}, render {}, present {}",
                      mxv(&TICK_MAX), mxv(&REND_MAX), mxv(&GUI_MAX), slw(&TICK_SLOW), slw(&REND_SLOW), slw(&GUI_SLOW)
                  );
              }
          }
          '''
          anchor = "impl MainWindow {"
          assert s.count(anchor) == 1
          s = s.replace(anchor, mod + "\n" + anchor, 1)

          pairs = [
           ("player.render();",
            "{ let __t = std::time::Instant::now(); player.render(); h700_perf::add(&h700_perf::REND_US, &h700_perf::REND_N, &h700_perf::REND_MAX, &h700_perf::REND_SLOW, __t); }"),
           ("self.gui.render(player);",
            "{ let __t = std::time::Instant::now(); self.gui.render(player); h700_perf::add(&h700_perf::GUI_US, &h700_perf::GUI_N, &h700_perf::GUI_MAX, &h700_perf::GUI_SLOW, __t); h700_perf::report(); }"),
           ("player.tick(dt);",
            "{ let __t = std::time::Instant::now(); player.tick(dt); h700_perf::add(&h700_perf::TICK_US, &h700_perf::TICK_N, &h700_perf::TICK_MAX, &h700_perf::TICK_SLOW, __t); }"),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("OK timing patch")
          PY
          grep -n "h700_perf" desktop/src/app.rs | head -5

      - name: Add H700 core timing logs (optional)
        if: ${{ inputs.perf_timing }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("core/src/player.rs")
          s = p.read_text(encoding="utf-8")

          def rep(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)

          rep("let rval = func(context);\n\n            Self::run_actions(context);",
              "let __t0 = web_time::Instant::now();\n            let rval = func(context);\n            h700_perf2::add(&h700_perf2::FUNC_US, __t0);\n            let __t1 = web_time::Instant::now();\n            Self::run_actions(context);\n            h700_perf2::add_max(&h700_perf2::ACT_US, &h700_perf2::ACT_MAX, __t1);")
          rep("self.update_mouse_state(EnumSet::empty(), false, &mut false);",
              "let __t2 = web_time::Instant::now();\n        self.update_mouse_state(EnumSet::empty(), false, &mut false);\n        h700_perf2::add(&h700_perf2::MOUSE_US, __t2);")
          rep("self.gc_arena.borrow_mut().collect_debt();",
              "let __t3 = web_time::Instant::now();\n        self.gc_arena.borrow_mut().collect_debt();\n        h700_perf2::add_max(&h700_perf2::GC_US, &h700_perf2::GC_MAX, __t3);\n        h700_perf2::UPDATE_N.fetch_add(1, std::sync::atomic::Ordering::Relaxed);\n        h700_perf2::report();")
          rep("Avm1::run_frame(context);",
              "let __t4 = web_time::Instant::now();\n            Avm1::run_frame(context);\n            h700_perf2::add(&h700_perf2::AVM1_US, __t4);")

          rep("            match action.action_type {\n                // DoAction/clip event code.",
              "            let __label = {\n                let __clip = action.clip.name().map(|n| n.to_utf8_lossy().to_string()).unwrap_or_default();\n                match &action.action_type {\n                    ActionType::Normal { .. } => format!(\"Frame [{}]\", __clip),\n                    ActionType::Initialize { .. } => format!(\"Init [{}]\", __clip),\n                    ActionType::Construct { .. } => format!(\"Construct [{}]\", __clip),\n                    ActionType::Method { name, .. } => format!(\"Method {} [{}]\", name.to_utf8_lossy(), __clip),\n                    ActionType::NotifyListeners { method, .. } => format!(\"Notify {}\", method.to_utf8_lossy()),\n                }\n            };\n            let __ta = web_time::Instant::now();\n            match action.action_type {\n                // DoAction/clip event code.")
          rep("Avm1::notify_system_listeners(action.clip, listener, method, &args, context);\n                }\n            }\n",
              "Avm1::notify_system_listeners(action.clip, listener, method, &args, context);\n                }\n            }\n            h700_perf2::add_label(__label, __ta);\n")

          s += '''

          mod h700_perf2 {
              use std::collections::HashMap;
              use std::sync::Mutex;
              use std::sync::atomic::{AtomicU64, Ordering};
              use web_time::Instant;

              pub static FUNC_US: AtomicU64 = AtomicU64::new(0);
              pub static ACT_US: AtomicU64 = AtomicU64::new(0);
              pub static MOUSE_US: AtomicU64 = AtomicU64::new(0);
              pub static GC_US: AtomicU64 = AtomicU64::new(0);
              pub static AVM1_US: AtomicU64 = AtomicU64::new(0);
              pub static UPDATE_N: AtomicU64 = AtomicU64::new(0);
              pub static GC_MAX: AtomicU64 = AtomicU64::new(0);
              pub static ACT_MAX: AtomicU64 = AtomicU64::new(0);
              static LAST: Mutex<Option<Instant>> = Mutex::new(None);
              static LABELS: Mutex<Option<HashMap<String, (u64, u64)>>> = Mutex::new(None);

              pub fn add_label(label: String, start: Instant) {
                  let us = start.elapsed().as_micros() as u64;
                  let mut g = LABELS.lock().unwrap();
                  let e = g.get_or_insert_with(HashMap::new).entry(label).or_insert((0, 0));
                  e.0 += us;
                  e.1 += 1;
              }

              pub fn add(us: &AtomicU64, start: Instant) {
                  us.fetch_add(start.elapsed().as_micros() as u64, Ordering::Relaxed);
              }

              pub fn add_max(us: &AtomicU64, mx: &AtomicU64, start: Instant) {
                  let e = start.elapsed().as_micros() as u64;
                  us.fetch_add(e, Ordering::Relaxed);
                  mx.fetch_max(e, Ordering::Relaxed);
              }

              pub fn report() {
                  let mut last = LAST.lock().unwrap();
                  let now = Instant::now();
                  let start = *last.get_or_insert(now);
                  if now.duration_since(start).as_secs_f64() < 2.0 {
                      return;
                  }
                  *last = Some(now);
                  let ms = |a: &AtomicU64| a.swap(0, Ordering::Relaxed) as f64 / 1000.0;
                  let n = UPDATE_N.swap(0, Ordering::Relaxed);
                  eprintln!(
                      "H700 CORE (2s totals ms): update calls {} | func {:.0} (of which Avm1::run_frame {:.0}) | run_actions {:.0} | update_mouse_state {:.0} | gc collect_debt {:.0}",
                      n, ms(&FUNC_US), ms(&AVM1_US), ms(&ACT_US), ms(&MOUSE_US), ms(&GC_US)
                  );
                  eprintln!(
                      "H700 CORE max (single call, ms): run_actions {:.0} | gc collect_debt {:.0}",
                      ms(&ACT_MAX), ms(&GC_MAX)
                  );
                  let mut g = LABELS.lock().unwrap();
                  if let Some(map) = g.take() {
                      let mut v: Vec<_> = map.into_iter().collect();
                      v.sort_by(|a, b| b.1.0.cmp(&a.1.0));
                      for (label, (us, cnt)) in v.into_iter().take(8) {
                          eprintln!("H700 TOP {:>7.0} ms {:>6} calls  {}", us as f64 / 1000.0, cnt, label);
                      }
                  }
              }
          }
          '''
          p.write_text(s, encoding="utf-8")
          print("OK timing2 patch")
          PY
          grep -n "h700_perf2" core/src/player.rs | head -5

      - name: Build Ruffle
        run: |
          . "$HOME/.cargo/env"

          PROFILE="${{ inputs.profile || 'dist' }}"
          PUP="$(echo "$PROFILE" | tr a-z A-Z)"
          echo "Profile: $PROFILE"

          # H700 = quad Cortex-A53 (ARMv8.0, in-order): tune code generation for it.
          export RUSTFLAGS="-A dangerous_implicit_autorefs -C target-cpu=cortex-a53"
          export "CARGO_PROFILE_${PUP}_DEBUG=0"
          export "CARGO_PROFILE_${PUP}_STRIP=symbols"

          cargo build --profile "$PROFILE" --package ruffle_desktop

      - name: Prepare release artifact with recursive libraries
        run: |
          set -eu

          mkdir -p out/libs

          RUFFLE_FILE="$(find target/${{ inputs.profile || 'dist' }} -maxdepth 2 \
            -type f -executable \
            \( -name 'ruffle' \
            -o -name 'ruffle_desktop' \
            -o -name 'ruffle_desktop_native' \) \
            | head -n 1)"

          if [ -z "$RUFFLE_FILE" ]; then
            echo "ERRO: executável debug do Ruffle não encontrado."
            exit 1
          fi

          cp "$RUFFLE_FILE" out/ruffle
          chmod +x out/ruffle

          : > /tmp/lib_queue.txt
          : > /tmp/lib_seen.txt

          enqueue() {
            candidate="$1"

            if [ -f "$candidate" ] && ! grep -Fxq "$candidate" /tmp/lib_seen.txt; then
              echo "$candidate" >> /tmp/lib_queue.txt
            fi
          }

          is_forbidden_system_lib() {
            base="$(basename "$1")"

            case "$base" in
              libc.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libm.so.*|libgcc_s.so.*|ld-linux-*.so.*|libmount.so.*|libblkid.so.*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          collect_ldd_paths() {
            binary="$1"

            ldd "$binary" 2>/dev/null \
              | awk '
                  /=> \/.*/ { print $3 }
                  /^[[:space:]]*\/.*\(/ { print $1 }
                ' \
              | while IFS= read -r dependency; do
                  [ -n "$dependency" ] && enqueue "$dependency"
                done
          }

          collect_ldd_paths "$RUFFLE_FILE"

          for seed in \
            /usr/lib/aarch64-linux-gnu/libgtk-3.so.0 \
            /usr/lib/aarch64-linux-gnu/libgdk-3.so.0 \
            /usr/lib/aarch64-linux-gnu/libgdk_pixbuf-2.0.so.0 \
            /usr/lib/aarch64-linux-gnu/libgio-2.0.so.0 \
            /usr/lib/aarch64-linux-gnu/libgmodule-2.0.so.0 \
            /usr/lib/aarch64-linux-gnu/libxkbcommon.so.0 \
            /usr/lib/aarch64-linux-gnu/libxkbcommon-x11.so.0 \
            /usr/lib/aarch64-linux-gnu/libxcb-xkb.so.1 \
            /usr/lib/aarch64-linux-gnu/libssl.so.1.1 \
            /usr/lib/aarch64-linux-gnu/libcrypto.so.1.1
          do
            enqueue "$seed"
          done

          index=1

          while :; do
            current="$(sed -n "${index}p" /tmp/lib_queue.txt)"

            if [ -z "$current" ]; then
              break
            fi

            index=$((index + 1))

            if grep -Fxq "$current" /tmp/lib_seen.txt; then
              continue
            fi

            echo "$current" >> /tmp/lib_seen.txt

            if is_forbidden_system_lib "$current"; then
              echo "Ignorando biblioteca crítica do sistema: $current"
              continue
            fi

            if [ ! -f "$current" ]; then
              echo "AVISO: biblioteca não encontrada: $current"
              continue
            fi

            echo "Copiando: $current"
            cp -L "$current" "out/libs/$(basename "$current")"

            collect_ldd_paths "$current"
          done

          rm -f \
            out/libs/libasound.so.* \
            out/libs/libc.so.* \
            out/libs/libpthread.so.* \
            out/libs/libdl.so.* \
            out/libs/librt.so.* \
            out/libs/libm.so.* \
            out/libs/libgcc_s.so.* \
            out/libs/ld-linux-*.so.* \
            out/libs/libmount.so.* \
            out/libs/libblkid.so.*

          cp /tmp/ruffle_revision.txt out/revision.txt
          echo "release-stock-winit-xkb-x11-libs-h700" > out/patch.txt

          file out/ruffle | tee out/info.txt
          ldd out/ruffle | tee -a out/info.txt || true

          echo
          echo "Arquivos do artifact:"
          ls -lh out
          ls -lh out/libs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruffle-h700-release
          path: out/
